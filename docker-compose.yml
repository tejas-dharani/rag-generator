services:
  rag-generator:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Inside Docker, reach an Ollama server running on the host machine.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL_DOCKER:-http://host.docker.internal:11434/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - rag-data:/data
    restart: unless-stopped

volumes:
  rag-data:
